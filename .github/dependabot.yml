version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # let a release age a week before adopting it (security updates are exempt)
    groups:
      actions:
        patterns: ["*"]

  # Runtime dependencies get their own PRs and are never grouped: a new release of one can
  # change how the package behaves.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # let a release age a week before adopting it (security updates are exempt)
    groups:
      dev-tools:
        dependency-type: development
