name: Release

# Pushing a tag `vX.Y.Z` from main builds the package, publishes a GitHub Release, and publishes
# to PyPI (see CONTRIBUTING.md). Run it by hand (Actions > Release > Run workflow) for a dry run:
# the same checks and build, publishing nothing. Tick `testpypi` to also upload the build to
# TestPyPI. Do a dry run before tagging, because release tags cannot be undone.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      testpypi:
        description: Also upload the build to TestPyPI (once per version; files are immutable)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.26" # keep in sync with ci.yml

      - name: Check the tag is on main and matches the package version
        run: |
          version="$(uv version --short --frozen)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
              || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
            [ "v$version" = "$GITHUB_REF_NAME" ] \
              || { echo "::error::tag $GITHUB_REF_NAME does not match pyproject version v$version"; exit 1; }
          else
            echo "Dry run on $GITHUB_REF_NAME: would release v$version"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # The release notes are this version's section of CHANGELOG.md, so the changelog stays the
      # single source of truth and a release cannot go out without one.
      - name: Extract the release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '/^## \[/ { in_section = index($0, "[" v "]") > 0; next } in_section' \
            CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; }
          cat notes.md

      - run: uv build
      - run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/
            notes.md
          if-no-files-found: error

  github-release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" release/dist/*
          --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME"
          --notes-file release/notes.md

  # A tag publishes to PyPI; a manual run with `testpypi` ticked publishes to TestPyPI instead.
  # Authentication is PyPI "trusted publishing" (GitHub's OIDC identity): no token or secret is
  # stored anywhere. Both indexes are configured with this workflow and the `pypi` environment.
  publish:
    needs: build
    if: github.ref_type == 'tag' || inputs.testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: release/dist
          repository-url: ${{ github.ref_type == 'tag' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
