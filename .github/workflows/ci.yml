name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.26" # keep in sync with release.yml
          enable-cache: true

      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run basedpyright
      # Workflows are code too: lint them and audit them for security problems.
      - run: uvx --from actionlint-py==1.7.12.25 actionlint
      - run: uvx zizmor@1.33.1 --no-progress --min-severity medium .github

  # The package must work on every OS and on both ends of the supported Python range.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.26" # keep in sync with release.yml
          enable-cache: true
          python-version: ${{ matrix.python }}

      - run: uv sync --locked
      - run: uv run pytest --cov --cov-fail-under=95

  # The lower bounds in pyproject.toml must actually work, not just the locked versions.
  test-lowest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.26" # keep in sync with release.yml
          enable-cache: true
          python-version: "3.11"

      - run: uv run --isolated --resolution lowest-direct --group dev pytest

  # The built package must be valid, render on PyPI, and import from a clean environment.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.26" # keep in sync with release.yml

      - run: uv build
      - run: uvx twine check --strict dist/*
      - run: uv run --isolated --no-project --with dist/*.whl python -c "import package_name"

  # The API reference is generated from the docstrings; a broken reference fails the build.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.26" # keep in sync with release.yml
          enable-cache: true

      - run: uv run --locked --group docs sphinx-build -W --keep-going -b html docs docs/_build/html

  # The one check branch protection requires (see the infrastructure repo). It has a stable name
  # so changing the jobs or the test matrix above never needs an infrastructure change.
  # `always()` makes it report even when a job failed or was cancelled; it then fails unless
  # EVERY job's result is exactly `success` (anything else, including skipped or cancelled, fails).
  ci-required:
    if: always()
    needs: [lint, test, test-lowest, build, docs]
    runs-on: ubuntu-latest
    env:
      RESULTS: ${{ join(needs.*.result, ' ') }}
    steps:
      - name: Fail unless every CI job succeeded
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do [ "$result" = success ] || exit 1; done
