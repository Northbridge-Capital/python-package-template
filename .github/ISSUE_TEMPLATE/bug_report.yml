name: Bug report
description: Report a problem with this package
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `pip show REPLACE_ME`, or the tag/commit you're on.
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected instead, and the smallest steps to reproduce.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      render: shell
