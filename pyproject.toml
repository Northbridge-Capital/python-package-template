[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "REPLACE_ME"
version = "0.1.0"
description = "REPLACE_ME_DESCRIPTION"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Northbridge Capital" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Northbridge-Capital/REPLACE_ME"
Documentation = "https://northbridge-capital.github.io/REPLACE_ME/"
Source = "https://github.com/Northbridge-Capital/REPLACE_ME"
Issues = "https://github.com/Northbridge-Capital/REPLACE_ME/issues"
Changelog = "https://github.com/Northbridge-Capital/REPLACE_ME/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=9.0",
  "pytest-cov>=7.0",
  "ruff>=0.14",
  "basedpyright>=1.18",
]
docs = [
    "myst-parser>=5.2.0",
    "numpydoc>=1.11.0",
    "pydata-sphinx-theme>=0.24.0",
    "sphinx>=9.0.4",
    "sphinx-autobuild>=2025.8.25",
    "sphinx-copybutton>=0.5.2",
    "sphinxext-opengraph>=0.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/package_name"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DTZ", "S", "SIM", "PT", "RUF", "C4", "PIE", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "S101"]

[tool.ruff.format]
line-ending = "lf"

[tool.pytest.ini_options]
addopts = "-q"
filterwarnings = ["error"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/package_name"]
branch = true

[tool.basedpyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
strict = ["src"]
reportMissingTypeStubs = false
